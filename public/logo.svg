<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Mirch N Spicy</title>
  <desc id="desc">Circular Mirch N Spicy logo with a flaming red chilli and the words Spice Up Your Life</desc>
  <defs>
    <path id="topArc" d="M 91 257 A 165 165 0 0 1 421 257"/>
    <path id="bottomArc" d="M 94 280 A 165 165 0 0 0 418 280"/>
    <linearGradient id="chilli" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff4a37"/><stop offset="1" stop-color="#c91622"/></linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#ff9d16"/><stop offset=".62" stop-color="#ffc329"/><stop offset="1" stop-color="#fff06b"/></linearGradient>
  </defs>
  <circle cx="256" cy="256" r="246" fill="#071607"/>
  <circle cx="256" cy="256" r="204" fill="none" stroke="#f3f0df" stroke-width="10"/>
  <circle cx="256" cy="256" r="151" fill="none" stroke="#f3f0df" stroke-width="5" opacity=".95"/>
  <text fill="#f3f0df" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700" letter-spacing="2"><textPath href="#topArc" startOffset="50%" text-anchor="middle">MIRCH N SPICY</textPath></text>
  <text fill="#f3f0df" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="3"><textPath href="#bottomArc" startOffset="50%" text-anchor="middle">SPICE UP YOUR LIFE</textPath></text>
